```properties
# Nom de l'application
spring.application.name=api-rest-demo

# Port du serveur (8080 par defaut)
server.port=8080

# --- Configuration H2 ---
# URL de la base de donnees en memoire
spring.datasource.url=jdbc:h2:mem:formationdb

# Driver JDBC
spring.datasource.driver-class-name=org.h2.Driver

# Identifiants
spring.datasource.username=sa
spring.datasource.password=

# --- Console H2 (accessible via navigateur) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# Creer les tables automatiquement a partir des entites
spring.jpa.hibernate.ddl-auto=create-drop

# Afficher les requetes SQL dans la console (utile en developpement)
spring.jpa.show-sql=true

# Formater les requetes SQL pour la lisibilite
spring.jpa.properties.hibernate.format_sql=true

# Hibernate detecte automatiquement le dialecte H2
spring.jpa.defer-datasource-initialization=true
```